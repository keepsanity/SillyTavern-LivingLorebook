<div class="ll_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-brain"></i> Living Lorebook</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <!-- 활성화 -->
            <div class="ll-row" style="margin-bottom: 4px;">
                <label class="checkbox_label">
                    <input id="ll_enabled" type="checkbox" />
                    <span><span data-i18n="ll.sidebar.0">Enable extension</span></span>
                </label>
            </div>

            <!-- <span data-i18n="ll.sidebar.1">Target lorebook</span> -->
            <div class="ll-row">
                <label><i class="fa-solid fa-book" style="color: #63b3ed; margin-right: 4px;"></i>대상 로어북</label>
                <select id="ll_target_lorebook" class="ll-select">
                    <option value="" data-i18n="ll.sidebar.2">(Select)</option>
                </select>
            </div>

            <!-- Connection Profile (organize/compress/backfill) -->
            <div class="ll-row">
                <label><i class="fa-solid fa-plug" style="color: #81e6d9; margin-right: 4px;"></i><span data-i18n="ll.sidebar.3">Profile · Memory management</span></label>
                <select class="ll-select connection_profile">
                    <option value="" data-i18n="ll.sidebar.4">(Use main API)</option>
                </select>
                <div class="ll-help" style="width: 100%; margin-top: 2px;"><span data-i18n="ll.sidebar.5">Used for organization, compression, and summary backfill. Leave empty to use the main API.</span></div>
            </div>

            <!-- Connection Profile (AI 선택 전용) -->
            <div class="ll-row">
                <label><i class="fa-solid fa-microscope" style="color: #b794f4; margin-right: 4px;"></i><span data-i18n="ll.sidebar.6">Profile · AI selection</span></label>
                <select class="ll-select ll_selection_profile">
                    <option value="" data-i18n="ll.sidebar.7">(Same as above)</option>
                </select>
                <div class="ll-help" style="width: 100%; margin-top: 2px;"><span data-i18n="ll.sidebar.8">Used only for summary-based AI selection before generation. Leave empty to use the memory management profile.</span></div>
            </div>

            <hr class="ll-divider" />

            <div class="ll-row" style="justify-content: center;">
                <button id="ll_open_panel" class="menu_button" style="width: unset; white-space: nowrap; flex-direction: row;">
                    <i class="fa-solid fa-brain" style="margin-right: 4px;"></i> <span data-i18n="ll.sidebar.9">Open Living Lorebook</span>
                </button>
            </div>

        </div>
    </div>
</div>
